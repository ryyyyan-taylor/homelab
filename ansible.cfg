# Root-level ansible.cfg for Semaphore (which runs playbooks from the repo root)
# Mirrors ansible/ansible.cfg but with paths relative to the repo root.
[defaults]
deprecation_warnings = False
inventory          = ansible/inventory/
roles_path         = ansible/roles/
host_key_checking  = False
interpreter_python = auto_silent
stdout_callback    = default
result_format      = yaml
vars_plugins_enabled = ansible.builtin.host_group_vars, community.sops.sops

[ssh_connection]
pipelining = True

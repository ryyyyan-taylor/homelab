apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # Ignore StatefulSet fields that k8s API server defaults but Helm charts omit.
  # Affects all StatefulSets across all apps.
  resource.customizations.ignoreDifferences.apps_StatefulSet: |
    jqPathExpressions:
      - ".spec.updateStrategy.type"
      - ".spec.updateStrategy.rollingUpdate.partition"
      - ".spec.persistentVolumeClaimRetentionPolicy"

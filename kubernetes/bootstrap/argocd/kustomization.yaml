apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v2.14.2/manifests/install.yaml
  - cmp-plugin-cm.yaml
  - ingressroute.yaml
patches:
  - path: repo-server-patch.yaml
    target:
      kind: Deployment
      name: argocd-repo-server
  - path: argocd-server-patch.yaml
    target:
      kind: Deployment
      name: argocd-server
  - path: application-controller-patch.yaml
    target:
      kind: StatefulSet
      name: argocd-application-controller
  - path: applicationset-controller-patch.yaml
    target:
      kind: Deployment
      name: argocd-applicationset-controller
  - path: dex-server-patch.yaml
    target:
      kind: Deployment
      name: argocd-dex-server
  - path: notifications-controller-patch.yaml
    target:
      kind: Deployment
      name: argocd-notifications-controller
  - path: redis-patch.yaml
    target:
      kind: Deployment
      name: argocd-redis

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v2.14.2/manifests/install.yaml
  - cmp-plugin-cm.yaml
  - argocd-cm-patch.yaml
  - ingressroute.yaml
patches:
  - path: repo-server-patch.yaml
    target:
      kind: Deployment
      name: argocd-repo-server
  - path: argocd-server-patch.yaml
    target:
      kind: Deployment
      name: argocd-server
  - path: argocd-components-resources-patch.yaml

# UserVolumeConfig for the 1TB photos drive, passed through to talos-worker-1
# (VM 201) as scsi1 — see terraform/talos-vms.tf and the App-Immich/Storage
# wiki pages. QEMU's raw block-device passthrough here doesn't forward
# the underlying ATA serial (shows up as generic "QEMU HARDDISK"), so the
# disk is selected by size instead — the only other disk on this node is the
# 64GB Talos install disk (vda). Mounts automatically at /var/mnt/photos.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: photos
provisioning:
  diskSelector:
    match: disk.size > 900u * 1024u * 1024u * 1024u
  minSize: 900GB
  maxSize: 1000GB
filesystem:
  type: xfs

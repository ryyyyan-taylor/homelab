---
# Exposes the Authentik embedded LDAP outpost (pod port 3389) through Traefik's
# TCP ldap entrypoint at 10.0.1.210:389, reachable by all LXCs on the flat network.
apiVersion: v1
kind: Service
metadata:
  name: authentik-ldap
  namespace: authentik
spec:
  selector:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: server
  ports:
    - name: ldap
      port: 389
      targetPort: 3389
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: authentik-ldap
  namespace: authentik
spec:
  entryPoints:
    - ldap
  routes:
    - match: HostSNI(`*`)
      services:
        - name: authentik-ldap
          port: 389

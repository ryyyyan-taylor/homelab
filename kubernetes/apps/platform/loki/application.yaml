apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "14"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.29.0
    helm:
      values: |
        fullnameOverride: loki

        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            storageClass: local-path
            size: 10Gi

        # Disable scale-out components (not needed for single binary)
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        # Disable Nginx gateway — Traefik handles ingress
        gateway:
          enabled: false

        # Disable MinIO object storage
        minio:
          enabled: false

        # Disable memcached caches (not needed for single-node homelab)
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        # Disable canary DaemonSet (lokiCanary is top-level in chart 6.x)
        lokiCanary:
          enabled: false

        # Disable self-monitoring (Grafana Agent operator)
        monitoring:
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false

        # Disable Helm test
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.updateStrategy.rollingUpdate.partition
        - .status.terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

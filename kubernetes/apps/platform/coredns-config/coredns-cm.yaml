apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    lab.ryantaylor.tech:53 {
        errors
        forward . 10.0.1.160
        cache 30
    }
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . 1.1.1.1 1.0.0.1 {
           max_concurrent 1000
           policy round_robin
        }
        cache 120 {
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: coredns
      data:
        Corefile: |
          .:53 {
              errors
              health {
                  lameduck 5s
              }
              ready
              log . {
                  class error
              }
              prometheus :9153

              kubernetes cluster.local in-addr.arpa ip6.arpa {
                  pods insecure
                  fallthrough in-addr.arpa ip6.arpa
                  ttl 30
              }
              forward . 1.1.1.1 1.0.0.1 {
                 max_concurrent 1000
                 policy round_robin
              }
              cache 120 {
                 disable denial cluster.local
              }
              loop
              reload
              loadbalance
          }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: coredns
      spec:
        replicas: 4
        template:
          spec:
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    k8s-app: kube-dns

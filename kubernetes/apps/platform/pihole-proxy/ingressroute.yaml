apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`pihole.lab.ryantaylor.tech`)
      middlewares:
        - name: authentik-forwardauth
          namespace: traefik
      services:
        - name: pihole
          port: 80
  tls: {}

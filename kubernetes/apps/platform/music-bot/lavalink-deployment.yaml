# IMPORTANT: music-bot's wavelink Node websocket does not reconnect on its
# own after this pod restarts (confirmed 2026-08-19 — no "Lavalink node
# connected" log line for 20+ min post-restart, causing 30s
# ChannelTimeoutException on every /play that looks like a voice/network
# bug but isn't). Always `kubectl rollout restart deployment/music-bot -n
# music-bot` right after restarting this deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lavalink
  namespace: music-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lavalink
  template:
    metadata:
      labels:
        app: lavalink
    spec:
      initContainers:
        # lavalink.plugins in the ConfigMap auto-downloads these from
        # maven.lavalink.dev on every cold start of the plugins volume; that
        # host has proven unreliable (outage 2026-08-08). Pre-seed the same
        # jars from GitHub releases into the persistent plugins volume so
        # Lavalink's PluginManager finds them already present and skips the
        # download entirely. Idempotent — skips files that already exist, so
        # this is a no-op once the volume is populated.
        - name: fetch-plugins
          image: curlimages/curl:8.21.0
          command:
            - sh
            - -c
            - |
              set -e
              fetch() {
                if [ -f "/plugins/$2" ]; then
                  echo "$2 already present, skipping"
                else
                  curl -fsSL --max-time 60 -o "/plugins/$2" "$1"
                fi
              }
              fetch https://github.com/topi314/LavaSrc/releases/download/4.8.3/lavasrc-plugin-4.8.3.jar lavasrc-plugin-4.8.3.jar
              # Lavalink loads every jar present in this volume regardless
              # of the lavalink.plugins list in the ConfigMap — remove the
              # retired youtube-plugin jar or it keeps loading and
              # competing with lavasrc's ytdlp source for ytsearch:.
              rm -f /plugins/youtube-plugin-1.18.2.jar
          volumeMounts:
            - name: plugins
              mountPath: /plugins
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
        # yt-dlp (used by lavasrc's ytdlp source, see ConfigMap) is
        # deliberately re-fetched on every start rather than skip-if-present
        # like the jars above — unlike pinned plugin versions, yt-dlp needs
        # to track YouTube's changes, and "latest" is the whole point.
        #
        # Must be the standalone yt-dlp_linux (PyInstaller) build, not the
        # plain yt-dlp zipapp — ghcr.io/lavalink-devs/lavalink:4 is a JRE
        # image with no python3, so the zipapp can't execute.
        - name: fetch-ytdlp
          image: curlimages/curl:8.21.0
          command:
            - sh
            - -c
            - |
              set -e
              curl -fsSL --max-time 60 -o /opt/yt-dlp/yt-dlp \
                https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
              chmod +x /opt/yt-dlp/yt-dlp
          volumeMounts:
            - name: ytdlp
              mountPath: /opt/yt-dlp
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      containers:
        - name: lavalink
          image: ghcr.io/lavalink-devs/lavalink:4
          ports:
            - containerPort: 2333
          env:
            - name: LAVALINK_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: music-bot-secret
                  key: lavalink-password
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: music-bot-secret
                  key: spotify-client-id
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: music-bot-secret
                  key: spotify-client-secret
          volumeMounts:
            - name: config
              mountPath: /opt/Lavalink/application.yml
              subPath: application.yml
            - name: plugins
              mountPath: /opt/Lavalink/plugins
            - name: ytdlp
              mountPath: /opt/yt-dlp
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          readinessProbe:
            # /version requires the Authorization header in Lavalink 4.2.x,
            # and probe httpHeaders can't source a secret — tcpSocket is
            # sufficient to confirm the server is up and listening.
            tcpSocket:
              port: 2333
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2333
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: lavalink-config
        - name: plugins
          persistentVolumeClaim:
            claimName: lavalink-plugins
        - name: ytdlp
          # emptyDir, not a PVC — the binary is re-fetched every pod start
          # anyway (see fetch-ytdlp init container), so persistence buys
          # nothing here.
          emptyDir: {}

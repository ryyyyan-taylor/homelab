apiVersion: v1
kind: ConfigMap
metadata:
  name: lavalink-config
  namespace: music-bot
data:
  application.yml: |
    server:
      port: 2333
      address: 0.0.0.0

    lavalink:
      plugins:
        - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
          repository: "https://maven.lavalink.dev/releases"
          snapshot: false
        - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
          repository: "https://maven.lavalink.dev/releases"
          snapshot: false
      server:
        password: "${LAVALINK_SERVER_PASSWORD}"
        sources:
          # Built-in youtube source is deprecated/unreliable — youtube-plugin
          # above replaces it.
          youtube: false
          bandcamp: false
          soundcloud: false
          twitch: false
          vimeo: false
          nico: false
          http: false
          local: false

    plugins:
      lavasrc:
        providers:
          - "ytsearch:\"%ISRC%\""
          - "ytsearch:%QUERY%"
        sources:
          spotify: true
          applemusic: false
          deezer: false
          yandexmusic: false
          flowerytts: false
          youtube: false
          vkmusic: false
          tidal: false
          qobuz: false
          ytdlp: false
          jiosaavn: false
        spotify:
          clientId: "${SPOTIFY_CLIENT_ID}"
          clientSecret: "${SPOTIFY_CLIENT_SECRET}"
          countryCode: "US"
          playlistLoadLimit: 6
          albumLoadLimit: 6
      youtube:
        enabled: true
        allowSearch: true
        allowDirectVideoIds: true
        allowDirectPlaylistIds: true
        clients:
          - MUSIC
          - TV
          - ANDROID_VR
          - WEB
          - WEBEMBEDDED
        oauth:
          enabled: true
          # Only the TV client actually uses OAuth (see youtube-source
          # README "Available Clients" table) — it must be in the clients
          # list above or the grant is a no-op. No refreshToken yet — first
          # startup logs a device-code URL; use a BURNER Google account.
          # Once linked, the plugin logs the refreshToken; paste it here
          # (or move to a secret) to skip re-linking on future restarts.

    metrics:
      prometheus:
        enabled: false

    logging:
      level:
        root: INFO
        lavalink: INFO

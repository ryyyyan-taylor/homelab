apiVersion: v1
kind: ConfigMap
metadata:
  name: lavalink-config
  namespace: music-bot
data:
  application.yml: |
    server:
      port: 2333
      address: 0.0.0.0

    lavalink:
      plugins:
        - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
          repository: "https://maven.lavalink.dev/releases"
          snapshot: false
        # dev.lavalink.youtube (youtube-plugin) removed 2026-08-19 — every
        # client (WEB, WEB_EMBEDDED_PLAYER, TV/OAuth, TVHTML5_SIMPLY, MWEB,
        # ANDROID_MUSIC, ANDROID_VR, IOS) failed for every track. TV hit an
        # open upstream bug (lavalink-devs/youtube-source#226); the rest
        # hit YouTube bot detection or SABR-only formats. Replaced by
        # lavasrc's ytdlp source below, which tracks YouTube's changes
        # more actively.
      server:
        password: "${LAVALINK_SERVER_PASSWORD}"
        sources:
          # Built-in youtube source is deprecated/unreliable — lavasrc's
          # ytdlp source below replaces it.
          youtube: false
          bandcamp: false
          soundcloud: false
          twitch: false
          vimeo: false
          nico: false
          http: false
          local: false

    plugins:
      lavasrc:
        providers:
          - "ytsearch:\"%ISRC%\""
          - "ytsearch:%QUERY%"
        sources:
          spotify: true
          applemusic: false
          deezer: false
          yandexmusic: false
          flowerytts: false
          youtube: false
          vkmusic: false
          tidal: false
          qobuz: false
          ytdlp: true
          jiosaavn: false
        spotify:
          clientId: "${SPOTIFY_CLIENT_ID}"
          clientSecret: "${SPOTIFY_CLIENT_SECRET}"
          countryCode: "US"
          playlistLoadLimit: 6
          albumLoadLimit: 6
        ytdlp:
          # Binary is (re-)fetched fresh on every pod start by the
          # fetch-ytdlp init container — see lavalink-deployment.yaml.
          path: "/opt/yt-dlp/yt-dlp"
          searchLimit: 10

    metrics:
      prometheus:
        enabled: false

    logging:
      level:
        root: INFO
        lavalink: INFO

apiVersion: v1
kind: ConfigMap
metadata:
  name: lavalink-config
  namespace: music-bot
data:
  application.yml: |
    server:
      port: 2333
      address: 0.0.0.0

    lavalink:
      plugins:
        - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
          repository: "https://maven.lavalink.dev/releases"
          snapshot: false
        # dev.lavalink.youtube (youtube-plugin) removed 2026-08-19 — every
        # client (WEB, WEB_EMBEDDED_PLAYER, TV/OAuth, TVHTML5_SIMPLY, MWEB,
        # ANDROID_MUSIC, ANDROID_VR, IOS) failed for every track. TV hit an
        # open upstream bug (lavalink-devs/youtube-source#226); the rest
        # hit YouTube bot detection or SABR-only formats. Replaced by
        # lavasrc's ytdlp source below, which tracks YouTube's changes
        # more actively.
      server:
        password: "${LAVALINK_SERVER_PASSWORD}"
        sources:
          # Built-in youtube source is deprecated/unreliable — lavasrc's
          # ytdlp source below replaces it.
          youtube: false
          bandcamp: false
          soundcloud: false
          twitch: false
          vimeo: false
          nico: false
          http: false
          local: false

    plugins:
      lavasrc:
        providers:
          # Deezer first: matches the real studio track by ISRC instead of
          # gambling on a YouTube search result (music videos, lyric
          # videos, covers, etc. all rank ahead of "official audio" on
          # plenty of searches). ytsearch stays as the fallback for
          # anything Deezer doesn't have.
          - "dzisrc:%ISRC%"
          - "dzsearch:%QUERY%"
          - "ytsearch:\"%ISRC%\""
          - "ytsearch:%QUERY%"
        sources:
          spotify: true
          applemusic: false
          deezer: true
          yandexmusic: false
          flowerytts: false
          youtube: false
          vkmusic: false
          tidal: false
          qobuz: false
          ytdlp: true
          jiosaavn: false
        spotify:
          clientId: "${SPOTIFY_CLIENT_ID}"
          clientSecret: "${SPOTIFY_CLIENT_SECRET}"
          countryCode: "US"
          playlistLoadLimit: 6
          albumLoadLimit: 6
        deezer:
          # Both values are reverse-engineered, not distributed by LavaSrc
          # or Deezer — see docs/inventory.md and the wiki Music Bot page
          # for how to obtain them and why they live outside this repo's
          # secret-filling automation.
          masterDecryptionKey: "${DEEZER_MASTER_KEY}"
          arl: "${DEEZER_ARL}"
          # Free-tier quality only. Requesting FLAC/MP3_320/MP3_256/AAC_64
          # requires a Premium account on the arl — deliberately not doing
          # that here so a free/burner account is enough and there's no
          # subscription tied to the account that ends up flagged.
          formats: ["MP3_128", "MP3_64"]
        ytdlp:
          # Binary is (re-)fetched fresh on every pod start by the
          # fetch-ytdlp init container — see lavalink-deployment.yaml.
          path: "/opt/yt-dlp/yt-dlp"
          searchLimit: 10

    metrics:
      prometheus:
        enabled: false

    logging:
      level:
        root: INFO
        lavalink: INFO

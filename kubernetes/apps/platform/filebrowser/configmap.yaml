apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-config
  namespace: filebrowser
data:
  config.yaml: |
    http:
      port: 80
    server:
      database:
        path: /home/filebrowser/data/database.sqlite
      cacheDir: /home/filebrowser/data/tmp
      sources:
        - path: /home/filebrowser/data/files
          name: files
          config:
            defaultEnabled: true
    auth:
      methods:
        noauth: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: smokeping
  namespace: smokeping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smokeping
  template:
    metadata:
      labels:
        app: smokeping
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: smokeping
          image: lscr.io/linuxserver/smokeping:2.9.0-r0-ls186
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Denver
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: config-overrides
              mountPath: /config/Targets
              subPath: Targets
            - name: config-overrides
              mountPath: /config/Probes
              subPath: Probes
          readinessProbe:
            httpGet:
              path: /smokeping/smokeping.cgi
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /smokeping/smokeping.cgi
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
        - name: rrd-api
          image: lscr.io/linuxserver/smokeping:2.9.0-r0-ls186
          command: ["perl", "/srv/server.pl"]
          ports:
            - containerPort: 8081
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: rrd-api
              mountPath: /srv
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 48Mi
      volumes:
        - name: rrd-api
          configMap:
            name: smokeping-rrd-api
        - name: config
          persistentVolumeClaim:
            claimName: smokeping-config
        - name: data
          persistentVolumeClaim:
            claimName: smokeping-data
        - name: config-overrides
          configMap:
            name: smokeping-config

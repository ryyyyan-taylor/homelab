apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-lab
  namespace: traefik
spec:
  secretName: wildcard-lab-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.lab.ryantaylor.tech"
  dnsNames:
    - "*.lab.ryantaylor.tech"
    - "lab.ryantaylor.tech"

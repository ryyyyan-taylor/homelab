apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    hideVersion: true

  widgets.yaml: |
    - greeting:
        text_size: xl
        text: lab.ryantaylor.tech
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelab
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank

  services.yaml: |
    - Platform:
        - ArgoCD:
            href: https://argocd.lab.ryantaylor.tech
            icon: argocd
            description: GitOps engine
        - Traefik:
            href: https://traefik.lab.ryantaylor.tech
            icon: traefik
            description: Ingress controller
        - Authentik:
            href: https://authentik.lab.ryantaylor.tech
            icon: authentik
            description: SSO
        - Grafana:
            href: https://grafana.lab.ryantaylor.tech
            icon: grafana
            description: Metrics & logs
        - Prometheus:
            href: https://prometheus.lab.ryantaylor.tech
            icon: prometheus
            description: Metrics
        - Alertmanager:
            href: https://alertmanager.lab.ryantaylor.tech
            icon: alertmanager
            description: Alerts
        - Loki:
            href: https://loki.lab.ryantaylor.tech
            icon: loki
            description: Log aggregation
        - Uptime Kuma:
            href: https://uptime.lab.ryantaylor.tech
            icon: uptime-kuma
            description: Synthetic uptime checks

    - Infrastructure:
        - Proxmox:
            href: https://10.0.1.135:8006
            icon: proxmox
            description: Hypervisor (10.0.1.135)
        - Pi-hole:
            href: http://10.0.1.160/admin
            icon: pi-hole
            description: DNS + ad-blocking
        - ntfy:
            href: https://ntfy.lab.ryantaylor.tech
            icon: ntfy
            description: Push notifications

    - Game Servers:
        - Minecraft:
            description: "CT 152 — TCP 25565"
            icon: minecraft
            widget:
              type: minecraft
              url: udp://10.0.1.152:25565
        - Terraria:
            description: "CT 153 — TCP 7777"
            icon: terraria
        - Corekeeper:
            description: "CT 151"
            icon: si-steam

  bookmarks.yaml: |
    - Homelab:
        - GitHub Repo:
            - href: https://github.com/ryyyyan-taylor/homelab
              icon: github

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: ""

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 84.5.0
    helm:
      values: |
        fullnameOverride: monitoring

        # Disable control-plane monitors — Talos doesn't expose these endpoints
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        # Prometheus
        prometheus:
          ingress:
            enabled: false
          prometheusSpec:
            retention: 30d
            # local-path-provisioner doesn't honor fsGroup with subPath mounts —
            # init container chowns the prometheus-db subPath so Prometheus (uid 1000) can write
            initContainers:
              - name: init-chown-data
                image: busybox:1.37.0
                command:
                  - sh
                  - -c
                  - chown -R 1000:2000 /prometheus && chmod -R 1777 /prometheus
                volumeMounts:
                  - name: prometheus-monitoring-prometheus-db
                    mountPath: /prometheus
                    subPath: prometheus-db
                securityContext:
                  runAsUser: 0
                  runAsNonRoot: false
                  allowPrivilegeEscalation: true
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            additionalScrapeConfigs:
              - job_name: proxmox-host-node-exporter
                static_configs:
                  - targets: ['10.0.1.135:9100']
                    labels:
                      hostname: pve
              - job_name: lxc-node-exporter
                static_configs:
                  - targets: ['10.0.1.151:9100']
                    labels:
                      hostname: corekeeper
                  - targets: ['10.0.1.152:9100']
                    labels:
                      hostname: minecraft
                  - targets: ['10.0.1.153:9100']
                    labels:
                      hostname: terraria
                  - targets: ['10.0.1.160:9100']
                    labels:
                      hostname: pihole
                  - targets: ['10.0.1.161:9100']
                    labels:
                      hostname: network

        # Alertmanager
        alertmanager:
          ingress:
            enabled: false
          alertmanagerSpec:
            configSecret: alertmanager-config
            # Same local-path + subPath fsGroup quirk as Prometheus
            initContainers:
              - name: init-chown-data
                image: busybox:1.37.0
                command:
                  - sh
                  - -c
                  - chown -R 1000:2000 /alertmanager && chmod -R 1777 /alertmanager
                volumeMounts:
                  - name: alertmanager-monitoring-alertmanager-db
                    mountPath: /alertmanager
                    subPath: alertmanager-db
                securityContext:
                  runAsUser: 0
                  runAsNonRoot: false
                  allowPrivilegeEscalation: true
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi

        # Grafana
        grafana:
          ingress:
            enabled: false
          persistence:
            enabled: true
            storageClassName: local-path
            size: 5Gi
          admin:
            existingSecret: monitoring-secrets
            userKey: grafana-admin-user
            passwordKey: grafana-admin-password
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.loki.svc.cluster.local:3100
              access: proxy
              isDefault: false
          dashboards:
            default:
              node-exporter-full:
                gnetId: 1860
                revision: 37
                datasource: Prometheus
          grafana.ini:
            server:
              root_url: https://grafana.lab.ryantaylor.tech
            "auth.proxy":
              enabled: "true"
              header_name: X-Authentik-Username
              header_property: username
              auto_sign_up: "true"
            auth:
              signout_redirect_url: "https://authentik.lab.ryantaylor.tech"
            users:
              auto_assign_org: "true"
              auto_assign_org_role: Admin
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .status.terminatingReplicas
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .status.terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

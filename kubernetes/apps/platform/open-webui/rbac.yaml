apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-webui-cluster-reader
  namespace: open-webui

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-webui-cluster-reader
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - nodes
      - namespaces
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  # Deliberately no `secrets` (read exposes decoded values, not just
  # metadata), and no exec/port-forward/write verbs anywhere.

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-webui-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-webui-cluster-reader
subjects:
  - kind: ServiceAccount
    name: open-webui-cluster-reader
    namespace: open-webui

apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      serviceAccountName: open-webui-cluster-reader
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:0.11.0
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: http://10.0.1.170:11434
            - name: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
              value: X-authentik-email
            - name: WEBUI_AUTH_TRUSTED_NAME_HEADER
              value: X-authentik-name
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: webui-secret-key
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data

---
- name: Adopt all LXCs
  hosts: game_servers,infrastructure,ai
  remote_user: root
  ignore_unreachable: true
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/all/vars.yml"
  pre_tasks:
    - name: Load all-group secrets (LDAP bind password etc.)
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../inventory/group_vars/all/secrets.sops.yaml"
  roles:
    - base
    - sssd

- name: Configure pi-hole
  hosts: pi-hole
  remote_user: root
  ignore_unreachable: true
  roles:
    - pihole

- name: Configure network LXC
  hosts: network
  remote_user: root
  ignore_unreachable: true
  roles:
    - network

- name: Configure Minecraft server
  hosts: minecraft
  remote_user: root
  ignore_unreachable: true
  pre_tasks:
    - name: Load game server secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../inventory/group_vars/game_servers/secrets.sops.yaml"
  roles:
    - minecraft

- name: Configure Terraria server
  hosts: terraria
  remote_user: root
  ignore_unreachable: true
  pre_tasks:
    - name: Load game server secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../inventory/group_vars/game_servers/secrets.sops.yaml"
  roles:
    - terraria

- name: Configure Corekeeper server
  hosts: corekeeper
  remote_user: root
  ignore_unreachable: true
  pre_tasks:
    - name: Load game server secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../inventory/group_vars/game_servers/secrets.sops.yaml"
  roles:
    - corekeeper

- name: Configure Ollama server
  hosts: ollama
  remote_user: root
  ignore_unreachable: true
  roles:
    - ollama

---
- name: Verify LGSM is installed
  stat:
    path: /home/terrariaserver/linuxgsm.sh
  register: _lgsm
  failed_when: not _lgsm.stat.exists

# Move Steam credentials out of common.cfg and into secrets-common.cfg
# (secrets-common.cfg is LGSM's intended location for credentials)
- name: Template LGSM common config (no credentials)
  template:
    src: common.cfg.j2
    dest: /home/terrariaserver/lgsm/config-lgsm/terrariaserver/common.cfg
    owner: terrariaserver
    group: terrariaserver
    mode: "0600"

- name: Template LGSM secrets config (Steam credentials)
  template:
    src: secrets-common.cfg.j2
    dest: /home/terrariaserver/lgsm/config-lgsm/terrariaserver/secrets-common.cfg
    owner: terrariaserver
    group: terrariaserver
    mode: "0600"
  no_log: true

- name: Template server config
  template:
    src: terrariaserver.txt.j2
    dest: /home/terrariaserver/serverfiles/terrariaserver.txt
    owner: terrariaserver
    group: terrariaserver
    mode: "0600"
  no_log: true

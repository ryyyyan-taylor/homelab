---
ollama_version: "0.32.5"

# Must match the Proxmox host's NVIDIA driver exactly (PLAN.md Phase A/B
# gotchas) — the container has no kernel module of its own, only the
# userspace driver libraries talking to the host's passed-through devices.
ollama_nvidia_driver_version: "550.163.01-2"

ollama_host: "0.0.0.0:11434"
ollama_models_dir: /var/lib/ollama/models

ollama_pull_models:
  - qwen2.5:3b
  - llama3.2:3b
  - nomic-embed-text

# Sources allowed to reach the Ollama API (11434) — everything else gets
# rejected. Enforced via nftables inside the container itself, not Proxmox's
# firewall (see PLAN.md Known Issues: enabling Proxmox's cluster-wide
# firewall switch would also start evaluating traffic for the Talos VMs,
# which all have firewall=true set too — far bigger blast radius than
# intended for this one container).
ollama_api_allowed_sources:
  - 10.244.0.0/16 # k8s pod CIDR (Open WebUI, Phase E)
  - 10.0.1.200 # talos-cp
  - 10.0.1.201 # talos-worker-1
  - 10.0.1.202 # talos-worker-2
  - 100.64.0.0/10 # Tailscale CGNAT range

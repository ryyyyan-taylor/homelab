name: Build and push music-bot

on:
  push:
    branches: [main]
    paths:
      - 'apps/music-bot/**'
      - '.github/workflows/music-bot.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/music-bot
          push: true
          tags: |
            ghcr.io/ryyyyan-taylor/homelab-music-bot:latest
            ghcr.io/ryyyyan-taylor/homelab-music-bot:${{ github.sha }}

name: Build and push spotify-tool

on:
  push:
    branches: [main]
    paths:
      - 'apps/spotify-tool/web/**'
      - 'apps/spotify-tool/downloader/**'
      - '.github/workflows/spotify-tool.yaml'

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/spotify-tool/web
          push: true
          tags: |
            ghcr.io/ryyyyan-taylor/homelab-spotify-tool-web:latest
            ghcr.io/ryyyyan-taylor/homelab-spotify-tool-web:${{ github.sha }}

  build-downloader:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/spotify-tool/downloader
          push: true
          tags: |
            ghcr.io/ryyyyan-taylor/homelab-spotify-tool-downloader:latest
            ghcr.io/ryyyyan-taylor/homelab-spotify-tool-downloader:${{ github.sha }}

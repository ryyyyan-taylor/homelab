name: Build and push dash

on:
  push:
    branches: [main]
    paths:
      - 'apps/dash/**'
      - '.github/workflows/dash.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/dash
          push: true
          tags: |
            ghcr.io/ryyyyan-taylor/homelab-dash:latest
            ghcr.io/ryyyyan-taylor/homelab-dash:${{ github.sha }}
